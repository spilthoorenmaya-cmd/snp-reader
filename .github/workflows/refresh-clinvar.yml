name: Refresh ClinVar evidence catalog
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_clinvar_catalog.py"
      - ".github/workflows/refresh-clinvar.yml"
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'
permissions:
  contents: write
concurrency:
  group: clinvar-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download NCBI ClinVar and build allele-specific evidence index
        run: python scripts/build_clinvar_catalog.py --limit 20000
      - name: Commit reference catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/clinvar-evidence.json
          if git diff --cached --quiet; then
            echo "No new evidence"
          else
            git commit -m "Refresh ClinVar reference evidence catalog"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published ClinVar evidence catalog."
                exit 0
              fi
              echo "Main changed during publication; retrying ($attempt/5)."
              sleep 5
            done
            echo "::error::Could not publish after five fast-forward attempts."
            exit 1
          fi
