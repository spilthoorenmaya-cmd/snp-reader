name: Test SNP Reader
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Parser, alleles, ZIP and Python reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node parser, genotype, ClinVar and ZIP tests
        run: |
          npm run test:coverage | tee coverage-report.txt
          echo "### JavaScript unit-test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "This covers loaded \`dist/*.js\` helper modules only; browser-rendered \`app.js\` is exercised separately through Chromium tests." >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/# start of coverage report/,/# end of coverage report/p' coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline reference and ClinVar import tests
        run: |
          python -m unittest -v test_myheritage_snp_extract.py test_clinvar_local_match.py
          python -m unittest discover -s tests -p "test_*.py" -v
  browser:
    name: Real browser upload and privacy regression tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Upload, drag/drop, parsing and export in Chromium
        run: npm run test:e2e
