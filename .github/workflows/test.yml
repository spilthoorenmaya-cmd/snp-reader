name: Test SNP Reader

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test browser DNA parser
        run: npm test
      - name: Test offline Python matchers
        run: python -m unittest -v test_myheritage_snp_extract.py test_clinvar_local_match.py
