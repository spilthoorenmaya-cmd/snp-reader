name: Deploy SNP Reader to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "tests/**"
      - "package.json"
      - "scripts/build_clinvar_catalog.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Gate deployment on DNA parser, allele and live-browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node parser, alleles, ZIP and UI regression tests
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage-report.txt
          echo "### JavaScript unit-test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "This covers loaded \`dist/*.js\` helper modules only; browser-rendered \`app.js\` is exercised separately through Chromium tests." >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/# start of coverage report/,/# end of coverage report/p' coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline Python reference and ClinVar catalog tests
        run: |
          python -m unittest -v test_myheritage_snp_extract.py test_clinvar_local_match.py
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install pinned Playwright
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test real local-file upload and results in Chromium
        run: npm run test:e2e
  deploy:
    name: Publish only after all regressions pass
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
